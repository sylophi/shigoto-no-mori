# The repo's one pnpm workspace: every JavaScript package, one lockfile,
# and the settings below for all of them.
packages:
  - app
  - hub
  - marketing
  - lint
  - packages/*

# nodeLinker: hoisted is required by electron-forge so it can crawl a
# flat node_modules tree when packaging. hoistingLimits keeps each
# package's dependencies in its own node_modules instead of hoisting
# them to the root, so app/node_modules stays the tree forge packages
# and the app's scripts read.
nodeLinker: hoisted
hoistingLimits: workspaces

# blockExoticSubdeps: false is a project-scoped allowance for the
# @electron/node-gyp transitive dep (git+https://github.com/electron/node-gyp.git,
# pinned SHA, used by @electron/rebuild during native-module builds).
blockExoticSubdeps: false

# Supply-chain hardening, pinned in-repo so it holds for every clone
# (not just machines with a hardened global rc): delay installs of
# newly published versions by 7 days (minutes), and refuse updates
# whose trust signals (provenance, signatures) weaken.
minimumReleaseAge: 10080
# Effect ships 4.0.x patches every few days, so the owner exempted it on
# 2026-10-07 to pin the newest release. The cooldown holds for the rest.
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
trustPolicy: no-downgrade
# trustPolicy waivers: transitive pins published before their projects
# adopted npm provenance. Every integrity hash was verified against the
# registry. Each waiver names an exact version, so it stops applying once
# the pin moves. semver 5.x/6.x are frozen lines reached through ^5/^6
# ranges, so re-resolving cannot clear them.
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0
  - "@octokit/endpoint@9.0.6"
  # The exception to the note above: the project's 1.0.x releases were
  # attested and its later ones (1.1.0, then this) are not, all from the
  # project's own maintainers. @pierre/diffs pins it from 1.3.0 on.
  - "@pierre/theme@2.0.0"
  - material-icon-theme@5.36.1
  # chokidar 4.0.3 (reached through marketing's @astrojs/check) was
  # published without the provenance its 4.0.1 had. Verified on the
  # registry: the same sole maintainer (paulmillr) published both, and
  # 5.0.0 is back to provenance from CI.
  - chokidar@4.0.3

# Per-package build-script trust: only the packages set to true here may
# run install scripts.
allowBuilds:
  electron: true
  # esbuild (vite's, Astro's and wrangler's bundler) and workerd (the
  # hub's Worker runtime) validate their platform binary in a
  # postinstall, the binary itself arriving as an optional dependency.
  esbuild: true
  workerd: true
  lefthook: true
  electron-winstaller: false
  # appdmg's two native addons, pulled in by the dmg maker
  # (@electron-forge/maker-dmg -> electron-installer-dmg -> appdmg).
  # They set the Finder attributes and build the .DS_Store alias behind
  # the disk image's drag-to-Applications window, and appdmg needs both
  # the moment it loads, so the maker cannot run at all unless node-gyp
  # compiles them. Build tooling only: neither is bundled into the app.
  fs-xattr: true
  macos-alias: true
  # Clerk transitives. The first two postinstalls only print promo and
  # funding banners. bufferutil and utf-8-validate are optional native speedups
  # for ws that fall back to pure JS when absent. None need to build.
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  utf-8-validate: false
  # node-pty (script console PTY) ships Node-API prebuilds that Electron
  # loads as-is, and forge.config.ts's rebuildConfig skips rebuilding it,
  # so its install-time node-gyp build is skipped too. Those scripts
  # would have made the bundled spawn-helper executable, and that is
  # app/scripts/fix-node-pty-helper.mts's job instead.
  node-pty: false

# Force tar >= 7.5.10 to patch CVE-2026-29786 (GHSA-qffp-2rhf-9h96):
# hardlink path traversal via drive-relative linkpath. Pulled in transitively
# through @electron/rebuild -> @electron/node-gyp. No 6.x backport exists.
#
# Force tmp >= 0.2.7 to patch CVE-2026-44705 (GHSA-ph9p-34f9-6g65),
# CVE-2025-54798 (GHSA-52f5-9888-hmc6), and the 0.2.6 _assertPath
# type-confusion path traversal (GHSA on tmp < 0.2.7). Pulled in
# transitively through @electron-forge/cli -> @inquirer/prompts ->
# external-editor.
overrides:
  "tar@<7.5.10": "^7.5.10"
  "tmp@<0.2.7": "0.2.7"
  # semver 5.x (via @electron-forge/cli -> username -> execa ->
  # cross-spawn) has no provenance attestation while 7.x does, so any
  # re-resolution of the lockfile trips trustPolicy: no-downgrade.
  # Forcing 7.x keeps every consumer on the attested line.
  "semver@<7.7.2": "^7.7.2"
  # Force sharp >= 0.35.4 to patch the bundled libheif (GHSA-g89c-p67h-r497,
  # GHSA-2jg2-4ch7-h545). miniflare (under the hub's wrangler) pins sharp
  # to an exact version, and even the newest @cloudflare/vitest-pool-workers
  # still pins a miniflare on 0.35.2. Drop this once wrangler and
  # vitest-pool-workers ship past it.
  "sharp@<0.35.4": "^0.35.4"

# The versions the packages share, or will once code moves into
# packages/, pinned once. A package depends on one as "catalog:".
# marketing keeps TypeScript 6 on its own (marketing/README.md has why),
# and the hub vitest 4.1 (hub/README.md has why).
catalog:
  "@base-ui/react": ^1.6.0
  "@effect/atom-react": 4.0.2
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/sortable": ^10.0.0
