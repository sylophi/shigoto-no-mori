  "@effect/sql-sqlite-bun": 4.0.2
  "@effect/sql-sqlite-do": 4.0.2
  "@effect/sql-sqlite-node": 4.0.2
  "@effect/tsgo": 0.51.1
  "@fontsource-variable/geist": ^5.2.9
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@fontsource/zen-maru-gothic": ^5.2.8
  "@pierre/diffs": ^1.4.3
  "@types/node": ^24.13.5
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@xterm/addon-fit": 0.11.0
  "@xterm/addon-web-links": 0.12.0
  "@xterm/addon-webgl": 0.19.0
  "@xterm/xterm": 6.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cmdk: ^1.1.1
  dompurify: ^3.4.15
  effect: 4.0.2
  lucide-react: ^1.23.0
  marked: ^18.0.13
