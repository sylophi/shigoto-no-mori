name: Install workspace
description: Sets up pnpm and Node, then installs the lockfile without running install scripts.

runs:
  using: composite
  steps:
    # Pinned to commit digests like release.yml, so a retagged action
    # cannot change what runs.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: "22"
        # On Windows restoring the store takes longer than the downloads it
        # saves, which overlap the lockfile's verification.
        cache: ${{ runner.os != 'Windows' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
