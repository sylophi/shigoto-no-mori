# The gates a prerelease passes before it is tagged: app/lab/release.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-mac:
    # Apple Silicon runner, the one arch we ship.
    runs-on: macos-latest
    # The Electron app lives in app/, so every shell step runs from there.
    defaults:
      run:
        working-directory: app
    # Every tag builds prod (SM_FLAVOR unset), its bundle where forge
    # packs it.
    env:
      APP_PATH: out/Shigoto no Mori-darwin-arm64/Shigoto no Mori.app
    steps:
      # Every action is pinned to a commit digest rather than a tag,
      # because a tag is mutable and this job holds the signing
      # identity: retagging any of them would run attacker code in the
      # same process that imports the Developer ID certificate and the
      # notarization password. Bump a pin by resolving the new tag to
      # its commit sha, never by loosening it back to a tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # Every build is signed and notarized. A full release must point
      # at a commit on main, so one cannot be cut from a side branch by
      # accident. A PRERELEASE may be tagged anywhere (a test build cut
      # from a feature branch) and is signed like any other: only this
      # repo's admin can publish a release and a fork's workflows never
      # see these secrets, so an on-main rule for prereleases would only
      # have produced test builds Gatekeeper refuses to open.
      - name: Require a full release to be on main
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "Prerelease: building the tagged commit as is."
            exit 0
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "A full release tag must point to a commit on origin/main. Mark the release as a prerelease to build from another branch."
            exit 1
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The forge prePackage hook compiles the file-sync engine and the
      # filesystem helper (Go modules), and the macOS runner image doesn't
      # ship Go. It compiles the bundled sm (packages/cli) with Bun.
      - uses: ./.github/actions/setup-toolchains

      # The shipped .app's Info.plist (CFBundleShortVersionString,
      # CFBundleVersion) and Electron's app.getVersion() both come from
      # package.json at packaging time. Patch it from the release tag so
      # the displayed version always matches the tag, without anyone
      # having to remember to bump package.json before tagging. A
      # non-semver tag (e.g. "v0.17", "latest") fails the run: building
      # with the placeholder 0.0.0 version makes the publisher create a
      # v0.0.0 release instead of populating the tagged one. Before the
      # install: a manifest changed after it makes the next `pnpm exec`
      # install the workspace again, which can fail on the hoisted tree
      # it already laid ("Directory not empty").
      - name: Sync package.json version with tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' isn't semver (expected e.g. v0.17.0). Refusing to build with the placeholder 0.0.0 version."
            exit 1
          fi
          npm pkg set version="$VERSION"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$APPLE_SIGNING_IDENTITY" || -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Missing signing secrets. Set APPLE_SIGNING_IDENTITY, BUILD_CERTIFICATE_BASE64, P12_PASSWORD, and KEYCHAIN_PASSWORD."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Validate notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Missing notarization secrets. Set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID."
            exit 1
          fi

      # A packaged build with no hub URL is valid but useless for remote
      # features. An unset repository variable expands to "", so warn
      # loudly instead of shipping an unconfigured release in silence.
      - name: Warn when the account service config is unset
        if: vars.SM_DEVICE_HUB_URL == '' || vars.SM_ACCOUNT_CLERK_PUBLISHABLE_KEY == ''
        run: echo "::warning::SM_DEVICE_HUB_URL or SM_ACCOUNT_CLERK_PUBLISHABLE_KEY is not set as a repository variable, so this build ships with remote features unconfigured"

      - name: Build distributables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Baked into the bundle, since a packaged app sees only
          # build-time env. Repository Actions variables, not secrets.
          SM_DEVICE_HUB_URL: ${{ vars.SM_DEVICE_HUB_URL }}
          SM_ACCOUNT_CLERK_PUBLISHABLE_KEY: ${{ vars.SM_ACCOUNT_CLERK_PUBLISHABLE_KEY }}
          SM_ACCOUNT_WEB_ORIGIN: ${{ vars.SM_ACCOUNT_WEB_ORIGIN }}
        run: pnpm exec electron-forge publish --dry-run

      - name: Verify signing and notarization
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      # The terminal command as the release signed it: Bun's binary under
      # the hardened runtime with the app's entitlements, which no local
      # build carries (those are signed ad hoc). It is also the updater's
      # installer, so one that cannot start strands every install on
      # this release.
      - name: Run the signed terminal command
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SM="$PWD/$APP_PATH/Contents/Resources/sm"
          SMOKE="$PWD/scripts/smoke-sm.sh"
          export SHIGOMORI_DATA_DIR="$RUNNER_TEMP/sm-empty-data"
          mkdir -p "$SHIGOMORI_DATA_DIR"
          cd "$RUNNER_TEMP"
          "$SMOKE" "$SM" "${TAG#v}"

      # The app as the release signed it, opening its store, which only
      # its own host does (node:sqlite in Electron): on a data folder that
      # does not exist and on one an earlier launch left an empty store.db
      # in. Then updating itself, the loop every later release depends
      # on: it stages a copy of itself signed again under a newer version
      # from a local release list, takes an install request, and comes
      # back swapped (scripts/smoke-app.mts). The identity signs that copy.
      - name: Launch the signed app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/smoke-app.mts "$APP_PATH"

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec electron-forge publish --from-dry-run

  # The Linux package (app/scripts/package-linux.mts), once the Mac job
  # has passed the tag's gates. On the oldest runner: node-pty's addon
  # and the file-sync engine link against its glibc (2.35), and run only
  # on that or newer.
  release-linux:
    needs: release-mac
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchains

      # The Mac job refused a tag that isn't semver. Before the install,
      # as there, so this runs on the runner image's npm: setup-node comes
      # with install-workspace.
      - name: Sync package.json version with tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm pkg set version="${TAG#v}"

      # The postinstall compiles node-pty's addon. Scripts are off for
      # the install, which would run it twice at once (the app's own and
      # the root's), the builds clearing each other's build/ folder.
      - uses: ./.github/actions/install-workspace

      - name: Postinstall
        working-directory: .
        run: pnpm run postinstall

      - name: Build the package
        env:
          SM_DEVICE_HUB_URL: ${{ vars.SM_DEVICE_HUB_URL }}
          SM_ACCOUNT_CLERK_PUBLISHABLE_KEY: ${{ vars.SM_ACCOUNT_CLERK_PUBLISHABLE_KEY }}
          SM_ACCOUNT_WEB_ORIGIN: ${{ vars.SM_ACCOUNT_WEB_ORIGIN }}
          SM_ACCOUNT_CLERK_OAUTH_CLIENT_ID: ${{ vars.SM_ACCOUNT_CLERK_OAUTH_CLIENT_ID }}
        run: pnpm run package:linux

      # The package as it ships, on an empty data dir: the terminal
      # command, node-pty's addon loaded by the shipped node, and the
      # host up.
      - name: Run the package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="$PWD/out/linux/shigomori-linux-x64-${TAG#v}"
          SMOKE="$PWD/scripts/smoke-sm.sh"
          export SHIGOMORI_DATA_DIR="$RUNNER_TEMP/sm-empty-data"
          mkdir -p "$SHIGOMORI_DATA_DIR"
          cd "$RUNNER_TEMP"

          "$SMOKE" "$PKG/sm" "${TAG#v}"

          "$PKG/node" -e "require('$PKG/node_modules/node-pty')"

          "$PKG/node" "$PKG/host.cjs" > host.log 2>&1 &
          HOST=$!
          for _ in $(seq 60); do
            grep -q "\[host\] up on" host.log && break
            sleep 1
          done
          kill "$HOST"
          wait "$HOST" || true
          cat host.log
          grep -q "\[host\] up on" host.log

      - name: Upload the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "out/make/shigomori-linux-x64-${TAG#v}.tar.gz" --clobber

  # Vercel deploys app.shigomori.com from web-client-prod
  # (hub/README.md). The ref update refuses a non-fast-forward, so a
  # branch moved by hand fails here instead of being overwritten. The
  # job token triggers no workflow run, but Vercel's GitHub app still
  # sees the push.
  web-client-prod:
    needs: release-mac
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward web-client-prod to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/web-client-prod...$SHA" --jq .status)"
          if [[ "$STATUS" == identical || "$STATUS" == behind ]]; then
            echo "web-client-prod already contains $TAG. Nothing to move."
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/web-client-prod" -f sha="$SHA"
