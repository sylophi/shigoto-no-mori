name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-mac:
    # Apple Silicon runner; matches the only arch we ship right now.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # Every build is signed and notarized. A full release must point
      # at a commit on main, so one cannot be cut from a side branch by
      # accident. A PRERELEASE may be tagged anywhere (a test build cut
      # from v2) and is signed like any other: only this repo's admin
      # can publish a release and a fork's workflows never see these
      # secrets, so an on-main rule for prereleases would only have
      # produced test builds Gatekeeper refuses to open.
      - name: Require a full release to be on main
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "Prerelease: building the tagged commit as is."
            exit 0
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "A full release tag must point to a commit on origin/main. Mark the release as a prerelease to build from another branch."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      # The forge prePackage hook compiles the bundled sm CLI (a Go
      # module in cli/), and the macOS runner image doesn't ship Go.
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The shipped .app's Info.plist (CFBundleShortVersionString,
      # CFBundleVersion) and Electron's app.getVersion() both come from
      # package.json at packaging time. Patch it from the release tag so
      # the displayed version always matches the tag, without anyone
      # having to remember to bump package.json before tagging. A
      # non-semver tag (e.g. "v0.17", "latest") fails the run: building
      # with the placeholder 0.0.0 version makes the publisher create a
      # v0.0.0 release instead of populating the tagged one.
      - name: Sync package.json version with tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' isn't semver (expected e.g. v0.17.0); refusing to build with the placeholder 0.0.0 version."
            exit 1
          fi
          npm pkg set version="$VERSION"

      - name: Import Developer ID certificate
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$APPLE_SIGNING_IDENTITY" || -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Missing signing secrets. Set APPLE_SIGNING_IDENTITY, BUILD_CERTIFICATE_BASE64, P12_PASSWORD, and KEYCHAIN_PASSWORD."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Validate notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Missing notarization secrets. Set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID."
            exit 1
          fi

      # A packaged build with no hub URL is valid but useless for remote
      # features. An unset repository variable expands to "", so warn
      # loudly instead of shipping an unconfigured release in silence.
      - name: Warn when the account service config is unset
        if: vars.SM_DEVICE_HUB_URL == '' || vars.SM_ACCOUNT_CLERK_PUBLISHABLE_KEY == ''
        run: echo "::warning::SM_DEVICE_HUB_URL or SM_ACCOUNT_CLERK_PUBLISHABLE_KEY is not set as a repository variable, so this build ships with remote features unconfigured"

      - name: Build distributables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The account service config baked into the bundle (#238). A
          # packaged app only sees build-time env, so a build without
          # these ships with remote features unconfigured. Set them as
          # repository Actions variables (they are not secrets).
          SM_ACCOUNT_CLERK_PUBLISHABLE_KEY: ${{ vars.SM_ACCOUNT_CLERK_PUBLISHABLE_KEY }}
          SM_DEVICE_HUB_URL: ${{ vars.SM_DEVICE_HUB_URL }}
          SM_ACCOUNT_WEB_ORIGIN: ${{ vars.SM_ACCOUNT_WEB_ORIGIN }}
        run: pnpm exec electron-forge publish --dry-run

      - name: Verify signing and notarization
        run: |
          APP_PATH="out/Shigoto no Mori-darwin-arm64/Shigoto no Mori.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec electron-forge publish --from-dry-run
