name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner; matches the only arch we ship right now.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The shipped .app's Info.plist (CFBundleShortVersionString,
      # CFBundleVersion) and Electron's app.getVersion() both come from
      # package.json at packaging time. Patch it from the release tag so
      # the displayed version always matches the tag, without anyone
      # having to remember to bump package.json before tagging. Skipped
      # for non-semver tags (e.g. "latest", "release-2026-05-17") so a
      # weird tag can't corrupt the package.json that Forge reads.
      - name: Sync package.json version with tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            pnpm pkg set version="$VERSION"
          else
            echo "Tag '$TAG' isn't semver — leaving package.json unchanged"
          fi

      - name: Build .app
        run: pnpm run package

      - name: Zip .app bundle
        # `ditto -c -k --keepParent` preserves resource forks, symlinks, and
        # signature metadata — the canonical way to archive a macOS bundle.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd "out/shigomori-darwin-arm64"
          ditto -c -k --keepParent "Shigoto no Mori.app" \
            "../../shigomori-darwin-arm64-${TAG}.zip"

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" "shigomori-darwin-arm64-${TAG}.zip"
