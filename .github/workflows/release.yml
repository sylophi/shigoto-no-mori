# The gates a prerelease passes before it is tagged: app/lab/release.md.
name: Release

on:
  release:
    types: [published]

# Only the job that attaches the assets, and the one that moves
# web-client-prod, write.
permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name }}
  # Baked into each build, since a packaged app sees only build-time env.
  # Repository Actions variables, not secrets.
  SM_DEVICE_HUB_URL: ${{ vars.SM_DEVICE_HUB_URL }}
  SM_ACCOUNT_CLERK_PUBLISHABLE_KEY: ${{ vars.SM_ACCOUNT_CLERK_PUBLISHABLE_KEY }}
  SM_ACCOUNT_WEB_ORIGIN: ${{ vars.SM_ACCOUNT_WEB_ORIGIN }}
  SM_ACCOUNT_CLERK_OAUTH_CLIENT_ID: ${{ vars.SM_ACCOUNT_CLERK_OAUTH_CLIENT_ID }}

jobs:
  # The tag's gates, ahead of the three builds. They build the commit
  # checked here, as a tag can be moved while they wait.
  tag:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # Each build sets package.json's version from the tag, and that
      # version names the assets the updaters compare.
      - name: Require a semver tag
        run: |
          if [[ ! "${TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' isn't semver (expected e.g. v0.17.0)."
            exit 1
          fi

      # A full release must point at a commit on main, so one cannot be
      # cut from a side branch by accident. A PRERELEASE may be tagged
      # anywhere (a test build cut from a feature branch) and is signed
      # like any other: only this repo's admin can publish a release and
      # a fork's workflows never see the signing secrets, so an on-main
      # rule for prereleases would only have produced test builds
      # Gatekeeper refuses to open.
      - name: Require a full release to be on main
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "Prerelease: building the tagged commit as is."
            exit 0
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "A full release tag must point to a commit on origin/main. Mark the release as a prerelease to build from another branch."
            exit 1
          fi

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release-mac:
    needs: tag
    # Apple Silicon runner, the one arch we ship.
    runs-on: macos-latest
    # The Electron app lives in app/, so every shell step runs from there.
    defaults:
      run:
        working-directory: app
    # Every tag builds prod (SM_FLAVOR unset), its bundle where forge
    # packs it.
    env:
      APP_PATH: out/Shigoto no Mori-darwin-arm64/Shigoto no Mori.app
    steps:
      # Every action is pinned to a commit digest rather than a tag,
      # because a tag is mutable and this job holds the signing
      # identity: retagging any of them would run attacker code in the
      # same process that imports the Developer ID certificate and the
      # notarization password. Bump a pin by resolving the new tag to
      # its commit sha, never by loosening it back to a tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The forge prePackage hook compiles the file-sync engine and the
      # filesystem helper (Go modules), and the macOS runner image doesn't
      # ship Go. It compiles the bundled sm (packages/cli) with Bun.
      - uses: ./.github/actions/setup-toolchains

      # The shipped .app's Info.plist (CFBundleShortVersionString,
      # CFBundleVersion) and Electron's app.getVersion() both come from
      # package.json at packaging time. Patch it from the release tag so
      # the displayed version always matches the tag, without anyone
      # having to remember to bump package.json before tagging. Before
      # the install: a manifest changed after it makes the next `pnpm
      # exec` install the workspace again, which can fail on the hoisted
      # tree it already laid ("Directory not empty").
      - name: Sync package.json version with tag
        run: npm pkg set version="${TAG#v}"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$APPLE_SIGNING_IDENTITY" || -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Missing signing secrets. Set APPLE_SIGNING_IDENTITY, BUILD_CERTIFICATE_BASE64, P12_PASSWORD, and KEYCHAIN_PASSWORD."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Validate notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Missing notarization secrets. Set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID."
            exit 1
          fi

      # A packaged build with no hub URL is valid but useless for remote
      # features. An unset repository variable expands to "", so warn
      # loudly instead of shipping an unconfigured release in silence.
      - name: Warn when the account service config is unset
        if: vars.SM_DEVICE_HUB_URL == '' || vars.SM_ACCOUNT_CLERK_PUBLISHABLE_KEY == ''
        run: echo "::warning::SM_DEVICE_HUB_URL or SM_ACCOUNT_CLERK_PUBLISHABLE_KEY is not set as a repository variable, so this build ships with remote features unconfigured"

      - name: Build distributables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-forge make

      - name: Verify signing and notarization
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      # The terminal command as the release signed it: Bun's binary under
      # the hardened runtime with the app's entitlements, which no local
      # build carries (those are signed ad hoc). It is also the updater's
      # installer, so one that cannot start strands every install on
      # this release.
      - name: Run the signed terminal command
        run: |
          SM="$PWD/$APP_PATH/Contents/Resources/sm"
          SMOKE="$PWD/scripts/smoke-sm.sh"
          export SHIGOMORI_DATA_DIR="$RUNNER_TEMP/sm-empty-data"
          mkdir -p "$SHIGOMORI_DATA_DIR"
          cd "$RUNNER_TEMP"
          "$SMOKE" "$SM" "${TAG#v}"

      # The app as the release signed it, opening its store, which only
      # its own host does (node:sqlite in Electron): on a data folder that
      # does not exist and on one an earlier launch left an empty store.db
      # in. Then updating itself, the loop every later release depends
      # on: it stages a copy of itself signed again under a newer version
      # from a local release list, takes an install request, and comes
      # back swapped (scripts/smoke-app.mts). The identity signs that copy.
      - name: Launch the signed app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/smoke-app.mts "$APP_PATH"

      # The dmg and the zip forge's makers write (forge.config.ts), with
      # the dots GitHub puts in place of the spaces in an uploaded name.
      - name: Name the assets
        run: |
          mkdir out/assets
          cp "out/make/Shigoto no Mori-${TAG#v}-arm64.dmg" "out/assets/Shigoto.no.Mori-${TAG#v}-arm64.dmg"
          cp "out/make/zip/darwin/arm64/Shigoto no Mori-darwin-arm64-${TAG#v}.zip" "out/assets/Shigoto.no.Mori-darwin-arm64-${TAG#v}.zip"

      # Handed to the attach job and kept a day, since the release holds
      # the real copies.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-mac
          path: app/out/assets/*
          if-no-files-found: error
          retention-days: 1

  # The Linux package (app/scripts/package-linux.mts). On the oldest
  # runner: node-pty's addon and the file-sync engine link against its
  # glibc (2.35), and run only on that or newer.
  release-linux:
    needs: tag
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchains

      # Before the install, as in the Mac job, so this runs on the runner
      # image's npm: setup-node comes with install-workspace.
      - name: Sync package.json version with tag
        run: npm pkg set version="${TAG#v}"

      # The postinstall compiles node-pty's addon. Scripts are off for
      # the install, which would run it twice at once (the app's own and
      # the root's), the builds clearing each other's build/ folder.
      - uses: ./.github/actions/install-workspace

      - name: Postinstall
        working-directory: .
        run: pnpm run postinstall

      - name: Build the package
        run: pnpm run package:linux

      # The package as it ships, on an empty data dir: the terminal
      # command, node-pty's addon loaded by the shipped node, and the
      # host up.
      - name: Run the package
        run: |
          PKG="$PWD/out/linux/shigomori-linux-x64-${TAG#v}"
          SMOKE="$PWD/scripts/smoke-sm.sh"
          export SHIGOMORI_DATA_DIR="$RUNNER_TEMP/sm-empty-data"
          mkdir -p "$SHIGOMORI_DATA_DIR"
          cd "$RUNNER_TEMP"

          "$SMOKE" "$PKG/sm" "${TAG#v}"

          "$PKG/node" -e "require('$PKG/node_modules/node-pty')"

          "$PKG/node" "$PKG/host.cjs" > host.log 2>&1 &
          HOST=$!
          for _ in $(seq 60); do
            grep -q "\[host\] up on" host.log && break
            sleep 1
          done
          kill "$HOST"
          wait "$HOST" || true
          cat host.log
          grep -q "\[host\] up on" host.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-linux
          path: app/out/make/shigomori-linux-x64-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The Windows installers and the packages their updates install
  # (forge.config.ts, MakerSquirrel), each built on a runner of its
  # arch. Unsigned for now. Arm64 is experimental, since no one has run
  # it by hand: its failure doesn't hold the release back, and its
  # installer's name says so.
  release-windows:
    needs: tag
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            experimental: false
            installer: x64-Setup.exe
          - arch: arm64
            runner: windows-11-arm
            experimental: true
            installer: arm64-experimental-Setup.exe
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      ARCH: ${{ matrix.arch }}
      MADE: out/make/squirrel.windows/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchains

      # As in the Linux job, before the install and on the image's npm.
      - name: Sync package.json version with tag
        run: npm pkg set version="${TAG#v}"

      - uses: ./.github/actions/install-workspace

      # Lays the 7-Zip Squirrel packs with and checks node-pty's ConPTY
      # addon.
      - name: Postinstall
        working-directory: .
        run: pnpm run postinstall

      - name: Build the installer
        run: pnpm run make

      # The terminal command on an empty data dir, then the installer
      # installing as a user's would: Squirrel's folder with the version
      # the package carries, the launcher, and that version's own sm.
      - name: Install the package
        run: |
          MADE="$PWD/$MADE"
          NUPKG="$(basename "$MADE"/*-full.nupkg)"
          SQUIRREL_VERSION="${NUPKG#shigomori-}"
          SQUIRREL_VERSION="${SQUIRREL_VERSION%-full.nupkg}"
          SM="$PWD/out/Shigoto no Mori-win32-$ARCH/resources/sm.exe"
          SMOKE="$PWD/scripts/smoke-sm.sh"
          export SHIGOMORI_DATA_DIR="$RUNNER_TEMP/sm-empty-data"
          mkdir -p "$SHIGOMORI_DATA_DIR"
          cd "$RUNNER_TEMP"

          "$SMOKE" "$SM" "${TAG#v}"

          "$MADE"/*Setup.exe --silent
          ROOT="$LOCALAPPDATA/shigomori"
          ls -la "$ROOT"
          test -f "$ROOT/Update.exe"
          test -f "$ROOT/Shigoto no Mori.exe"
          SM_VERSION="$("$ROOT/app-$SQUIRREL_VERSION/resources/sm.exe" --version)"
          echo "installed sm --version: $SM_VERSION"
          [[ "$SM_VERSION" == *"${TAG#v}"* ]]

      # GitHub turns the spaces in a name into dots. The updater takes
      # <configDir>-win32-<arch>-<version>.nupkg (engine updateFeed.ts),
      # and each other platform's picker passes over both.
      - name: Name the assets
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          mkdir out/assets
          cp "$MADE"/*-full.nupkg "out/assets/shigomori-win32-$ARCH-${TAG#v}.nupkg"
          cp "$MADE"/*Setup.exe "out/assets/Shigoto.no.Mori-${TAG#v}-$INSTALLER"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-windows-${{ matrix.arch }}
          path: app/out/assets/*
          if-no-files-found: error
          retention-days: 1

  # The release gets its assets only once every build has passed its
  # gates, so it never holds some platforms and not others, save
  # Windows arm64, which it goes out without when that build fails. The
  # download checks each build's artifact, as one archive, against the
  # digest recorded when it was uploaded, and fails on a mismatch.
  attach:
    needs: [release-mac, release-linux, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" assets/* --clobber

  # Vercel deploys app.shigomori.com from web-client-prod
  # (hub/README.md). The ref update refuses a non-fast-forward, so a
  # branch moved by hand fails here instead of being overwritten. The
  # job token triggers no workflow run, but Vercel's GitHub app still
  # sees the push.
  web-client-prod:
    needs: [tag, attach]
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fast-forward web-client-prod to the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.tag.outputs.sha }}
        run: |
          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/web-client-prod...$SHA" --jq .status)"
          if [[ "$STATUS" == identical || "$STATUS" == behind ]]; then
            echo "web-client-prod already contains $TAG. Nothing to move."
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/web-client-prod" -f sha="$SHA"
