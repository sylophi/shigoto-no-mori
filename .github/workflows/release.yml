name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner; matches the only arch we ship right now.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build .app
        run: pnpm run package

      - name: Zip .app bundle
        # `ditto -c -k --keepParent` preserves resource forks, symlinks, and
        # signature metadata — the canonical way to archive a macOS bundle.
        run: |
          cd "out/shigomori-darwin-arm64"
          ditto -c -k --keepParent "Shigoto no Mori.app" \
            "../../shigomori-darwin-arm64-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "shigomori-darwin-arm64-${GITHUB_REF_NAME}.zip"
