name: Walks

# The page walks (app/lab/walks.md): the packaged lab build, started on
# real git repos, its window driven as a person would. Too long for every
# pull request, so after each landing on release/v3, and by hand; the
# pre-cut check runs them on the build about to be cut. It goes when the
# branch merges into main.
on:
  push:
    branches: [release/v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # A full install, as the release job does, since packaging needs
  # Electron.
  walks:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: file-sync/go.mod
          cache-dependency-path: |
            file-sync/go.sum
            macfs/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package the lab build
        run: SM_FLAVOR=lab pnpm -C app package

      - name: Walks
        run: pnpm walks
        env:
          SM_WALK_LOGS: ${{ runner.temp }}/walk-logs

      - name: Keep the app's logs of a failed walk
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walk-logs
          path: ${{ runner.temp }}/walk-logs
          if-no-files-found: ignore
