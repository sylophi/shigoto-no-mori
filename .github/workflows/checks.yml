name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run on the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job runs one piece of the root `pnpm check` (package.json), by
# its script name, so CI and a local run mean the same thing.
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # oxlint and oxfmt are root dev dependencies, and their scripts run
    # over every package (app, hub, marketing, packages, cli).
    steps:
      # Pinned to commit digests like release.yml, so a retagged action
      # cannot change what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Only the two binaries are needed, so no install scripts: that
      # skips the Electron download and the app's own postinstall.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run check:lint

      - name: Lint rule tests
        run: pnpm run check:lint-rules

      - name: Format
        run: pnpm run check:format

  # Dead files, exports and dependencies across the workspace
  # (knip.jsonc). knip loads each package's tool configs, which the one
  # workspace install covers.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Knip
        run: pnpm run check:knip

  # The release build regenerates the third-party notices, so stale
  # committed copies make every shipped build report a "-dirty" commit.
  # The Go cache key matches release.yml's so the two share an entry.
  # macOS arm64 like release.yml: pnpm installs only the host's platform
  # packages, and the notices list the darwin-arm64 ones.
  licenses:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The notices also cover the Go modules linked into the bundled
      # CLI, file-sync engine and darwin helper.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            file-sync/go.sum
            macfs/go.sum

      # license-checker only reads package metadata, so no install
      # scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Third-party notices are up to date
        run: pnpm run check:licenses

  # The rest of what lefthook runs on commit. The hook runs only what a
  # change touches, and a commit can skip it, so nothing below has run
  # before a merge unless it runs here.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The typecheck reads sources and types only.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run check:typecheck

      # The contracts' golden fixtures read sources and JSON only too.
      - name: Contract fixtures
        run: pnpm run check:contracts

  # The hub Worker's typecheck and its vitest suite inside workerd. The
  # install runs the esbuild and workerd builds pnpm-workspace.yaml
  # allows.
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Hub checks
        run: pnpm run check:hub

  # The Go modules' tests, on macOS, the one platform sm and the
  # file-sync engine ship for: cli/ has darwin-only halves (clonefile
  # copies, disk usage), macfs/ is darwin-only, and file-sync watches
  # through FSEvents.
  go:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Only to run the root script: nothing is installed.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # file-sync/go.mod asks for the newer Go of the two modules.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: file-sync/go.mod
          cache-dependency-path: |
            cli/go.sum
            file-sync/go.sum
            macfs/go.sum

      - name: Go tests
        run: pnpm run check:go

  # Every proof in app/test, on macOS like the app they prove: they
  # drive the real sm and file-sync binaries (built from cli/ and
  # file-sync/, hence Go), real git, /bin/zsh for the login-shell
  # capture, and the keychain proof deletes a real login-keychain item.
  proofs:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # file-sync/go.mod asks for the newer Go of the two modules.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: file-sync/go.mod
          cache-dependency-path: |
            cli/go.sum
            file-sync/go.sum
            macfs/go.sum

      # No install scripts, so no Electron download (no proof opens a
      # window). The app's own postinstall still runs: the proofs that
      # start scripts need node-pty's spawn-helper made executable.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -C app run postinstall

      - name: Proofs
        run: pnpm run check:proofs
