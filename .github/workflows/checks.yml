name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run on the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # oxlint and oxfmt are app/ dev dependencies, and their scripts run
    # from the repo root over every package (app, hub, marketing, cli).
    defaults:
      run:
        working-directory: app
    steps:
      # Pinned to commit digests like release.yml, so a retagged action
      # cannot change what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Only the two binaries are needed, so no install scripts: that
      # skips the Electron download and the app's own postinstall.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

  # The release build regenerates the third-party notices, so stale
  # committed copies make every shipped build report a "-dirty" commit.
  # The Go cache key matches release.yml's so the two share an entry.
  # macOS arm64 like release.yml: pnpm installs only the host's platform
  # packages, and the notices list the darwin-arm64 ones.
  licenses:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # The notices also cover the Go modules linked into the bundled
      # CLI and file-sync engine.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            file-sync/go.sum

      # license-checker only reads package metadata, so no install
      # scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Third-party notices are up to date
        run: pnpm run licenses:check

  # The rest of what lefthook runs on commit. The hook runs only what a
  # change touches, and a commit can skip it, so nothing below has run
  # before a merge unless it runs here.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # tsc reads sources and types only.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

  # The hub Worker's typecheck and its vitest suite inside workerd, with
  # app/ installed too (hub/README.md has why). The hub's install runs
  # the esbuild and workerd builds its pnpm-workspace.yaml allows.
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            hub/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm -C app install --frozen-lockfile --ignore-scripts
          pnpm -C hub install --frozen-lockfile

      - name: Hub checks
        run: pnpm -C hub run check

  # The Go modules' tests, on macOS, the one platform sm and the
  # file-sync engine ship for: cli/ has darwin-only halves (clonefile
  # copies, disk usage) and file-sync watches through FSEvents.
  go:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # file-sync/go.mod asks for the newer Go of the two modules.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: file-sync/go.mod
          cache-dependency-path: |
            cli/go.sum
            file-sync/go.sum

      - name: CLI tests
        run: go test -C cli ./...

      - name: File-sync tests
        run: CGO_CFLAGS=-Wno-deprecated-declarations go test -C file-sync ./...

  # Every proof in app/test, on macOS like the app they prove: they
  # drive the real sm and file-sync binaries (built from cli/ and
  # file-sync/, hence Go), real git, /bin/zsh for the login-shell
  # capture, and the keychain proof deletes a real login-keychain item.
  proofs:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # file-sync/go.mod asks for the newer Go of the two modules.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: file-sync/go.mod
          cache-dependency-path: |
            cli/go.sum
            file-sync/go.sum

      # No install scripts, so no Electron download (no proof opens a
      # window). The app's own postinstall still runs: the proofs that
      # start scripts need node-pty's spawn-helper made executable.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run postinstall

      - name: Proofs
        run: pnpm test --all
