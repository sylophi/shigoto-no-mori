name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    # oxlint and oxfmt are app/ dev dependencies, and their scripts run
    # from the repo root over every package (app, hub, marketing, cli).
    defaults:
      run:
        working-directory: app
    steps:
      # Pinned to commit digests like release.yml, so a retagged action
      # cannot change what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Only the two binaries are needed, so no install scripts: that
      # skips the Electron download and the app's own postinstall.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check
