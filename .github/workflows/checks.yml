name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the run on the previous one, on main too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job runs one piece of the root `pnpm check` (package.json), by
# its script name, so CI and a local run mean the same thing.
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # oxlint and oxfmt are root dev dependencies, and their scripts run
    # over every package (app, hub, marketing, packages, cli).
    steps:
      # Pinned to commit digests like release.yml, so a retagged action
      # cannot change what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Only the two binaries are needed, so no install scripts: that
      # skips the Electron download and the app's own postinstall.
      - uses: ./.github/actions/install-workspace

      - name: Lint
        run: pnpm run check:lint

      - name: Format
        run: pnpm run check:format

  # Dead files, exports and dependencies across the workspace
  # (knip.jsonc). knip loads each package's tool configs, which the one
  # workspace install covers.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/install-workspace

      - name: Knip
        run: pnpm run check:knip

  # The rest of what lefthook runs on commit. The hook runs only what a
  # change touches, and a commit can skip it, so nothing below has run
  # before a merge unless it runs here.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The typecheck reads sources and types only.
      - uses: ./.github/actions/install-workspace

      - name: Typecheck
        run: pnpm run check:typecheck

      # The contracts' golden fixtures read sources and JSON only too.
      - name: Contract fixtures
        run: pnpm run check:contracts

  # Everything but the proofs, in one job. Each check runs even when one
  # before it failed, so a run reports every failure. A Mac runs all of
  # it too, in macos.yml.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-toolchains

      - uses: ./.github/actions/install-workspace
        id: install

      # Fails on missing or unknown license metadata, for the packages
      # pnpm installs here and the Go modules linked into file-sync and
      # the filesystem helper.
      - name: Third-party notices have license metadata
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -C app run licenses --out "$RUNNER_TEMP/licenses"

      # The engine's and the terminal's tests drive the filesystem helper,
      # built from nativefs/.
      - name: Engine
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:engine

      - name: Terminal
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:cli

      - name: Go tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:go

  # Every proof in app/test: they drive the real sm and file-sync
  # binaries (built with Bun from packages/cli, and from file-sync/ and
  # nativefs/ with Go) and real git.
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-toolchains

      # No install scripts, so no Electron download (no proof opens a
      # window). The app's own postinstall still runs: the proofs that
      # start scripts need node-pty's addon compiled, which ships no
      # Linux prebuild.
      - uses: ./.github/actions/install-workspace

      - name: App postinstall
        run: pnpm -C app run postinstall

      - name: Proofs
        run: pnpm run check:proofs

  # The Windows jobs run what can come out otherwise on Windows, split
  # like the jobs above so the slowest one alone sets the wait. Format
  # is left to Linux: the checkout is LF on every OS (.gitattributes), so
  # oxfmt reads the same bytes. The suites run as a desktop user does
  # (.github/unelevated.go).
  #
  # The static checks with an input of the OS's: the typecheck's script
  # runs through pnpm's shell emulator, lint's rules and knip read file
  # paths, and knip loads each package's configs. Then the Go helpers as
  # Windows builds them, and their licenses.
  windows-static:
    runs-on: windows-latest
    timeout-minutes: 15
    # Git's bash rather than PowerShell, so a step reads as it does in the
    # jobs above.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-toolchains

      - uses: ./.github/actions/install-workspace
        id: install
        with:
          store-cache: false

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:typecheck

      - name: Contract fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:contracts

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:lint

      - name: Knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:knip

      - name: Third-party notices have license metadata
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -C app run licenses --out "$RUNNER_TEMP/licenses"

      - name: Go helpers build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm -C app run file-sync:build && pnpm -C app run nativefs:build

      - name: Go vet
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: go vet -C file-sync ./... && go vet -C nativefs ./...

      - name: Go tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: go run .github/unelevated.go pnpm run check:go

  windows-engine:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-toolchains

      - uses: ./.github/actions/install-workspace
        id: install
        with:
          store-cache: false

      - name: Engine
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: go run .github/unelevated.go pnpm run check:engine

      - name: Terminal
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: go run .github/unelevated.go pnpm run check:cli

  # The proofs in two halves, each on a runner of its own, so a fixed
  # port is still one proof's at a time.
  windows-proofs:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-toolchains

      # The app's postinstall checks node-pty's prebuilt ConPTY addon is
      # there.
      - uses: ./.github/actions/install-workspace
        with:
          store-cache: false

      - name: App postinstall
        run: pnpm -C app run postinstall

      - name: Proofs
        run: go run .github/unelevated.go pnpm run check:proofs --shard=${{ matrix.shard }}/2
