name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the run on the previous one, on main too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job runs one piece of the root `pnpm check` (package.json), by
# its script name, so CI and a local run mean the same thing.
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # oxlint and oxfmt are root dev dependencies, and their scripts run
    # over every package (app, hub, marketing, packages, cli).
    steps:
      # Pinned to commit digests like release.yml, so a retagged action
      # cannot change what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Only the two binaries are needed, so no install scripts: that
      # skips the Electron download and the app's own postinstall.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run check:lint

      - name: Format
        run: pnpm run check:format

  # Dead files, exports and dependencies across the workspace
  # (knip.jsonc). knip loads each package's tool configs, which the one
  # workspace install covers.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Knip
        run: pnpm run check:knip

  # The rest of what lefthook runs on commit. The hook runs only what a
  # change touches, and a commit can skip it, so nothing below has run
  # before a merge unless it runs here.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The typecheck reads sources and types only.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run check:typecheck

      # The contracts' golden fixtures read sources and JSON only too.
      - name: Contract fixtures
        run: pnpm run check:contracts

  # Everything on macOS but the proofs, in one job, since the account
  # gets few macOS runners at a time. Each check runs even when one
  # before it failed, so a run reports every failure.
  engine:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # file-sync/go.mod asks for the newest Go of the modules. The cache
      # key matches release.yml's so the two share an entry.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: file-sync/go.mod
          cache-dependency-path: |
            file-sync/go.sum
            nativefs/go.sum

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The terminal binary is built with Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # The release build regenerates the notices, so stale committed
      # copies make every shipped build report a "-dirty" commit. They
      # list the darwin-arm64 packages, the only ones pnpm installs here,
      # and the Go modules linked into file-sync and the filesystem helper.
      - name: Third-party notices are up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:licenses

      # The engine's and the terminal's tests drive the filesystem helper,
      # built from nativefs/.
      - name: Engine
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:engine

      - name: Terminal
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:cli

      # file-sync watches through FSEvents.
      - name: Go tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:go

  # The engine's, the terminal's and the Go tests again on Linux, where
  # the filesystem helper and file-sync run on their Linux calls.
  engine-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: file-sync/go.mod
          cache-dependency-path: |
            file-sync/go.sum
            nativefs/go.sum

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Engine
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:engine

      - name: Terminal
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:cli

      - name: Go tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:go

  # Every proof in app/test, on macOS like the app they prove: they
  # drive the real sm and file-sync binaries (built with Bun from
  # packages/cli, and from file-sync/ and nativefs/ with Go) and real git.
  proofs:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # file-sync/go.mod asks for the newest Go of the modules.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: file-sync/go.mod
          cache-dependency-path: |
            file-sync/go.sum
            nativefs/go.sum

      # The terminal sm the proofs run is compiled with Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # No install scripts, so no Electron download (no proof opens a
      # window). The app's own postinstall still runs: the proofs that
      # start scripts need node-pty's spawn-helper made executable.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -C app run postinstall

      - name: Proofs
        run: pnpm run check:proofs
