# relay/ is a standalone pnpm project, exactly like cli/ is a
# standalone Go module: this file makes pnpm treat this directory as
# its own workspace root, so installs here never touch the Electron
# app's hoisted node_modules at the repo root.
#
# Supply-chain hardening replicated from the root pnpm-workspace.yaml
# so it holds for every clone: delay installs of newly published
# versions by 7 days (minutes), and refuse updates whose trust signals
# (provenance, signatures) weaken.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Per-package build-script trust. Both entries are verified needs:
# esbuild and workerd validate their platform binary in a postinstall
# (the binary itself arrives as an optional dependency). wrangler needs
# both at runtime.
allowBuilds:
  esbuild: true
  workerd: true
