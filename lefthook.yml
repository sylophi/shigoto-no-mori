pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm run typecheck
    lint:
      run: pnpm run lint
    format:
      run: pnpm run format:check
    theme-contract:
      run: pnpm run theme:check
    host-boundary:
      glob: "{host/**,main/**,renderer/**,shared/**,scripts/check-host-boundary.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run host:check
    dmg-art:
      run: pnpm run dmg:check
    # Both parity checks are glob-gated: identity:check alone costs
    # ~140 git spawns, so neither should run on unrelated commits.
    identity:
      glob: "{shared/repoIdentity.mts,shared/defaultBranch.mts,shared/fixtures/**,scripts/check-identity.mjs}"
      run: pnpm run identity:check
    go-test:
      glob: "{cli/**,shared/fixtures/**}"
      run: go test -C cli ./...
    # Boots the real ws binding on an ephemeral port and asserts the
    # auth/dispatch/broadcast/framing paths plus the hardening (terminate
    # on bad token, oversized-frame and Origin rejection, in-flight cap,
    # generation guard) and the explicit remote-tag contract. Gated to
    # the socket surface plus the contract axis that decides remote
    # exposure, so adding an untagged host invoke also trips it.
    socket:
      glob: "{host/socket/**,shared/ipc/socket/**,host/ipc/modules/globalConfig.ts,shared/ipc/modules/**,shared/ipc/contract.ts,shared/ipc/registerContract.ts,main/ipc/register.ts}"
      run: pnpm run socket:check
    # Typechecks the relay Worker package and runs its vitest suite
    # inside workerd (real D1, Durable Object and websocket bindings)
    # against the shared app-to-worker protocol, so enrollment, ticket,
    # relay, presence and revocation semantics cannot drift from
    # shared/relay/protocol.ts. relay/ is a standalone pnpm project with
    # its own lockfile, which the check installs first. One caveat: the
    # shared files it imports (shared/relay/protocol.ts and the frames.ts
    # it re-exports) live outside relay/, so their `zod` import resolves
    # from the repo-root node_modules, not relay/node_modules. The two
    # installs pin the same zod, so a root install is a prerequisite for
    # those shared files.
    relay:
      glob: "{relay/**,shared/relay/**}"
      run: pnpm run relay:check
