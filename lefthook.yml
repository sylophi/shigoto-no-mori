pre-commit:
  # Formatting runs alone first: it rewrites staged files, which every
  # check below reads. stage_fixed re-stages what oxfmt changed, and
  # lefthook holds back the unstaged hunks of a partly staged file
  # while it does.
  piped: true
  jobs:
    - name: format
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Every job that runs tests starts without the repository git hands
    # a hook (GIT_DIR, GIT_INDEX_FILE, GIT_WORK_TREE): a test's git that
    # inherited them ran against this repository. The runners scrub
    # every GIT_* as well (gitIsolation.ts), so a runner added here
    # without that is still covered.
    - name: checks
      group:
        parallel: true
        jobs:
          - name: typecheck
            run: pnpm run typecheck
          # Unused files, exports and dependencies across every workspace,
          # which CI checks too: about two seconds for the whole repo, run
          # alongside the typecheck, so here rather than at the push.
          - name: knip
            run: pnpm run check:knip
          - name: lint
            run: node_modules/.bin/oxlint --no-error-on-unmatched-pattern {staged_files}
          # format and lint only see staged files, so a change to the
          # tools' config (or their versions, pinned in the root
          # package.json and oxlint's in the catalog) reruns them over the
          # whole repo.
          - name: lint-all
            glob: "{.oxlintrc.json,lint/**,package.json,pnpm-workspace.yaml}"
            run: node_modules/.bin/oxlint
          # The functions the React Compiler skips, held to the list
          # (app/scripts/react-compiler-check.mts). A change to the
          # check or its list checks every file.
          - name: react-compiler
            glob: "{app/renderer/**,packages/ui/src/**,app/scripts/react-compiler-*}"
            run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON app/scripts/react-compiler-check.mts {staged_files}
          # The lint plugin's own rules (lint/README.md).
          - name: lint-rules
            glob: "lint/**"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE pnpm run check:lint-rules
          - name: format-all
            glob: "{.oxfmtrc.json,packages/ui/src/styles/index.css,package.json}"
            run: pnpm run format:check
          # The proofs the staged files reach: vitest related, plus the
          # proofs' covers lines (app/test/README.md).
          - name: proofs
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE pnpm -C app test --changed {staged_files}
          # hub/'s typecheck and suite, for hub/, the contracts it imports
          # and the workspace files that pin its packages.
          - name: hub
            glob: "{hub/**,packages/contracts/**,pnpm-lock.yaml,pnpm-workspace.yaml}"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE pnpm -C hub run check
          # The contracts' golden fixtures (packages/contracts/README.md).
          - name: contracts
            glob: "packages/contracts/**"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE pnpm run check:contracts
          # The engine's tests, its boundary proof among them
          # (packages/engine/README.md).
          - name: engine
            glob: "{packages/engine/**,packages/contracts/**,macfs/**,app/shared/fixtures/git-log.json}"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE pnpm run check:engine
          # The ui package's tests (packages/ui/README.md).
          - name: ui
            glob: "packages/ui/**"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE pnpm run check:ui
          # The terminal binary, built as it ships (packages/cli/README.md).
          - name: cli
            glob: "{packages/cli/**,packages/engine/src/**,packages/engine/test/lib/**,packages/contracts/**,macfs/**}"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE pnpm run check:cli
          # The file-sync engine (continuous worktree mirroring) is its own
          # Go module, tested on its own.
          - name: file-sync-test
            glob: "file-sync/**"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE CGO_CFLAGS=-Wno-deprecated-declarations node testTemp.mts go go test -C file-sync ./...
          # The darwin helper (macfs/), likewise.
          - name: macfs-test
            glob: "macfs/**"
            run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE node testTemp.mts go go test -C macfs ./...
