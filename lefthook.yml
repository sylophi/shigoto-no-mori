pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm run typecheck
    lint:
      run: pnpm run lint
    format:
      run: pnpm run format:check
    theme-contract:
      run: pnpm run theme:check
    host-boundary:
      glob: "{host/**,main/**,renderer/**,shared/**,web/**,scripts/check-host-boundary.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run host:check
    dmg-art:
      run: pnpm run dmg:check
    # Both parity checks are glob-gated: identity:check alone costs
    # ~140 git spawns, so neither should run on unrelated commits.
    identity:
      glob: "{shared/repoIdentity.mts,shared/defaultBranch.mts,shared/fixtures/**,scripts/check-identity.mjs}"
      run: pnpm run identity:check
    go-test:
      glob: "{cli/**,shared/fixtures/**}"
      run: go test -C cli ./...
    # Boots the real ws binding on an ephemeral port and asserts the
    # auth/dispatch/broadcast/framing paths plus the hardening (terminate
    # on bad token, oversized-frame and Origin rejection, in-flight cap,
    # generation guard) and the explicit remote-tag contract. Gated to
    # the socket surface plus the whole contract layer (shared/ipc/**
    # and the shared/schemas the contracts are built from, which feed
    # the invariant through allContractModules), so adding an untagged
    # host invoke also trips it.
    socket:
      glob: "{host/socket/**,host/ipc/modules/globalConfig.ts,host/ipc/modules/remoteAccess.ts,shared/ipc/**,shared/schemas/**,shared/relay/protocol.ts,main/ipc/register.ts,scripts/check-socket-host.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run socket:check
    # Typechecks the relay Worker package and runs its vitest suite
    # inside workerd (real D1, Durable Object and websocket bindings)
    # against the shared app-to-worker protocol, so enrollment, ticket,
    # relay, presence and revocation semantics cannot drift from
    # shared/relay/protocol.ts. relay/ is a standalone pnpm project with
    # its own lockfile, which the check installs first. One caveat: the
    # shared files it imports (shared/relay/protocol.ts and the frames.ts
    # it re-exports) live outside relay/, so their `zod` import resolves
    # from the repo-root node_modules, not relay/node_modules. The two
    # installs pin the same zod, so a root install is a prerequisite for
    # those shared files.
    relay:
      glob: "{relay/**,shared/relay/**}"
      run: pnpm run relay:check
    # Boots a stub Durable Object (a node ws server speaking the relay
    # envelope protocol) and drives two REAL relay connections through
    # the real link, asserting the sm hello/welcome over the relay, id
    # correlation, the void-field framing invariant, broadcast gating,
    # message-only error serialization, the local outbound size guard,
    # offline nacks, presence-driven peer teardown, fresh-ticket
    # redials, the revoked/superseded blocked verdicts, the ignored
    # hello token and the per-peer in-flight cap. Gated to the relay
    # transport surface plus the sm frame layer it multiplexes.
    relaylink:
      glob: "{shared/relay/**,shared/remote/**,host/relay/**,shared/ipc/socket/**,shared/ipc/registerContract.ts,shared/ipc/modules/remoteAccess.ts,host/ipc/modules/remoteAccess.ts,shared/util/limit.ts,scripts/check-relay-link.mjs,scripts/lib/relayStub.mjs,scripts/lib/relayBoot.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run relaylink:check
    # Durable proof for the direct data plane (v2 step 10, slice A):
    # boots the stub Durable Object plus a REAL ticket-mode listener on
    # an ephemeral loopback port, brokers connect tickets over the relay
    # via direct:connectInfo, and asserts the whole plane: fail-closed
    # brokering without a caller identity, ticket single-use, expiry and
    # wrong-peer binding, the live grant gate on the direct wire, the
    # direct-first openPeer routing with relay fallback and cache drop
    # on close, invokes flowing with the relay's forwardedCount flat,
    # and pushes reaching a direct-connected client through the shared
    # peerPush path. Gated to the direct surface plus the socket and
    # relay layers it composes.
    direct-plane:
      glob: "{host/direct/**,host/socket/**,host/ipc/modules/direct.ts,host/lib/util/binaries.ts,host/lib/scripts/process.ts,shared/ipc/modules/direct.ts,shared/ipc/socket/**,shared/ipc/transport.ts,shared/ipc/registerContract.ts,shared/relay/**,host/relay/**,shared/account/service.ts,shared/remote/supervisor.ts,scripts/check-direct-plane.mjs,scripts/lib/relayStub.mjs,scripts/lib/relayBoot.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run direct:check
    # End-to-end proof for the device-sync transfer plumbing: builds the
    # real sm binary, seeds fixture repos in a sandboxed SHIGOMORI_ROOT,
    # and moves a >1.5 MB git bundle between two REAL relay connections
    # as chunked grant-gated invokes (real handlers, real CLI, real
    # git), asserting grant refusal for ungranted peers, the
    # refs/shigomori/-only landing namespace, byte-identical objects,
    # transfer cleanup, and the coded corrupted-bundle error. Gated to
    # the sync surface plus the CLI engine it shells.
    sync-transfer:
      glob: "{cli/**,shared/ipc/modules/sync.ts,shared/ipc/modules/worktrees.ts,shared/ipc/hexId.ts,shared/ipc/buildClient.ts,shared/ipc/registerContract.ts,shared/ipc/socket/frames.ts,shared/relay/protocol.ts,host/ipc/modules/sync.ts,host/ipc/modules/worktrees.ts,host/ipc/peerSync.ts,host/ipc/cliDelegate.ts,host/relay/**,host/lib/sync/**,host/lib/idleRegistry.ts,host/lib/git/**,host/lib/scripts/**,host/lib/util/paths.ts,scripts/check-sync-transfer.mjs,scripts/lib/relayStub.mjs,scripts/lib/relayBoot.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run sync:check
    # End-to-end proof for the port-forward wire: drives the host-side
    # forward verbs between two REAL relay connections against real
    # loopback TCP fixture servers, asserting grant refusal before any
    # dial, echo round trips, server-initiated bytes over the long-poll
    # downlink, a ~1.5 MB transfer chunked under the relay frame cap,
    # drain-then-eof on server close, the coded connect failure, and
    # idempotent teardown. Slice B adds the client engine (local
    # listeners, both pumps, eof propagation, stopForward teardown and
    # the per-forward conn cap) driven over the same wire. Gated to the
    # forward surface plus the stub relay it rides.
    port-forward:
      glob: "{shared/ipc/modules/forward.ts,shared/ipc/hexId.ts,shared/ipc/buildClient.ts,shared/ipc/registerContract.ts,shared/ipc/socket/frames.ts,shared/relay/protocol.ts,host/ipc/modules/forward.ts,host/relay/**,host/lib/idleRegistry.ts,host/lib/net.ts,main/portForward/**,scripts/check-port-forward.mjs,scripts/lib/relayStub.mjs,scripts/lib/relayBoot.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run forward:check
    # Boots the same stub Durable Object and drives the BROWSER relay
    # connection (web/relay/connection.ts, built on the global WebSocket)
    # under node against a real node host peer, asserting connect,
    # connectPeer hello/welcome, a peer invoke round trip, presence, the
    # revoked/superseded blocked verdicts, a fresh-ticket redial and the
    # per-dial ticket mint. Gated to the browser connection plus the relay
    # transport surface it drives.
    web-relay:
      glob: "{web/**,shared/relay/**,shared/remote/**,shared/util/limit.ts,host/relay/**,scripts/check-web-relay.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run web:relay:check
    # Drives the web client's window.api bridge headlessly: the surface
    # parity against buildApi (so renderer components mount unmodified),
    # the localStorage-backed clientConfig and credential stores, the
    # stable per-browser deviceId, the redirect login flow's PKCE and
    # state discipline plus the enroll fields (platform "web"), the
    # sign-out revoke, the schema-derived stubs for OS-bound channels,
    # and the typed unconfigured/origin-blocked access states that keep
    # a misconfigured deployment from looping the relay supervisor.
    web-bridge:
      glob: "{web/**,shared/account/**,shared/ipc/**,shared/relay/protocol.ts,scripts/check-web-bridge.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run web:bridge:check
    # Drives the pure liveness rate limiters (renderer crash-loop guard
    # and fatal-relaunch guard) that decide recreate-vs-give-up and
    # relaunch-vs-stand. Gated to the pure module plus the check itself,
    # since the Electron wiring around them is a human-verify item.
    liveness:
      glob: "{main/liveness/**,scripts/check-liveness.mjs}"
      run: pnpm run liveness:check
    # Drives the electron-free account layer (main/account/*) end to end
    # with stubs: the PKCE math and authorize-URL params, the redirect
    # parse, the token-exchange form and error path, the relay client's
    # route/method/auth-tier discipline against the shared schemas, the
    # credential store's encrypt and plaintext-fallback round trips, and
    # the full loopback login flow plus its state-mismatch and timeout
    # rejections. Gated to the account surface so it stays off unrelated
    # commits. Proves sign-in, enrollment and storage cannot drift from
    # shared/relay/protocol.ts without electron or a browser.
    account:
      glob: "{main/account/**,shared/account/**,shared/ipc/modules/account.ts,shared/relay/protocol.ts,scripts/check-account.mjs,scripts/lib/checkKit.mjs}"
      run: pnpm run account:check
