pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm run typecheck
    lint:
      run: pnpm run lint
    format:
      run: pnpm run format:check
    layering:
      run: pnpm run check-layering

pre-push:
  parallel: true
  commands:
    layering:
      run: pnpm run check-layering
