pre-commit:
  # Formatting runs alone first: it rewrites staged files, which every
  # check below reads. stage_fixed re-stages what oxfmt changed, and
  # lefthook holds back the unstaged hunks of a partly staged file
  # while it does.
  piped: true
  jobs:
    - name: format
      run: app/node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: checks
      group:
        parallel: true
        jobs:
          - name: typecheck
            run: pnpm -C app run typecheck
          - name: lint
            run: app/node_modules/.bin/oxlint --no-error-on-unmatched-pattern {staged_files}
          # format and lint only see staged files, so a change to the
          # tools' config (or their versions, pinned in app/package.json)
          # reruns them over the whole repo.
          - name: lint-all
            glob: "{.oxlintrc.json,lint/**,app/package.json}"
            run: pnpm -C app run lint
          - name: format-all
            glob: "{.oxfmtrc.json,app/renderer/index.css,app/package.json}"
            run: pnpm -C app run format:check
          # The proofs and hub/'s check the staged files reach
          # (app/test/README.md).
          - name: proofs
            run: pnpm -C app test --changed {staged_files}
          - name: go-test
            glob: "{cli/**,app/shared/fixtures/git-log.json}"
            run: go test -C cli ./...
          # The file-sync engine (continuous worktree mirroring) is its own
          # Go module, tested on its own.
          - name: file-sync-test
            glob: "file-sync/**"
            run: CGO_CFLAGS=-Wno-deprecated-declarations go test -C file-sync ./...
