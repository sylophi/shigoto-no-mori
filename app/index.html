<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shigoto no Mori</title>
  </head>
  <body>
    <!-- The theme root (@shigomori/ui's root.tsx). data-shell="desktop"
         keeps it transparent over the window's vibrancy (index.css),
         where a browser tab paints its canvas. -->
    <div id="root" data-theme-scope data-shell="desktop"></div>
    <!-- External, as the window's policy has no inline allowance
         (main/electron/contentPolicy.ts): the web client's, which
         vite serves from web/public for both shells. -->
    <script src="/boot-theme.js"></script>
    <script type="module" src="/renderer/index.tsx"></script>
  </body>
</html>
